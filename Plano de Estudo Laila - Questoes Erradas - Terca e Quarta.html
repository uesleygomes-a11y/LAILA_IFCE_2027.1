<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plano de Estudo Laila - Questões Erradas - Terça e Quarta</title>
<style>
:root{--p:#4c46c8;--ink:#172033;--bg:#f5f7fb;--soft:#eef0ff}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;max-width:960px;margin:auto;padding:14px;background:var(--bg);color:var(--ink);line-height:1.6}
.hero,.card,.topic{background:white;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #0001}h1,h2,h3{line-height:1.2}button{font:inherit;font-weight:800;width:100%;padding:14px 16px;border:0;border-radius:13px;background:var(--p);color:white;margin:6px 0;text-align:left;cursor:pointer}
.topicbtn{background:var(--soft);color:#29236f;border:2px solid #cbcaff}.hidden{display:none}label{display:block;padding:9px;border-radius:10px}input[type=radio]{width:20px;height:20px;margin-right:8px}.q{border-top:1px solid #ddd;padding-top:10px;margin-top:12px}.feedback{background:var(--soft);padding:14px;border-radius:13px;font-weight:750}.review{margin:8px 0;padding:10px;border-left:4px solid #777;background:#fafafa}.barbox{height:14px;background:#ddd;border-radius:99px;overflow:hidden}#bar{height:100%;background:var(--p);width:0}.badge{display:inline-block;background:var(--soft);padding:6px 10px;border-radius:999px;font-weight:800}
@media(max-width:600px){body{padding:10px}.hero,.card,.topic{padding:16px;border-radius:16px}}
</style></head><body>
<section class="hero"><span class="badge">REVISÃO PERSONALIZADA • CARMEN RIOS</span><h1>🎯 Laila — Questões Erradas</h1>
<p><strong>Terça e quarta-feira.</strong> Este plano trabalha especificamente os conteúdos em que houve erro no simulado preparatório. A lógica é: <strong>abrir tópico → estudar → praticar → corrigir → entender o erro → acompanhar percentual.</strong></p></section>
<section class="card"><h2>Seu progresso</h2><div class="barbox"><div id="bar"></div></div><p id="progress"></p></section>
<main id="app"></main>
<script>
const topics=[{"day": "Terça-feira", "id": "port", "title": "Português — Figuras de linguagem e crase", "study": "<h3>1. Figuras de linguagem</h3>\n<p><strong>Personificação</strong> atribui ação ou característica humana a algo não humano: “A lua observava a cidade”. <strong>Metáfora</strong> faz uma comparação implícita: “Ele é uma fera nos estudos”. <strong>Hipérbole</strong> exagera: “Esperei uma eternidade”. <strong>Metonímia</strong> troca um termo por outro relacionado: “Li Machado de Assis” significa ler a obra do autor.</p>\n<h3>2. Crase</h3><p>A crase costuma surgir da união da preposição <strong>a</strong> com o artigo feminino <strong>a/as</strong>. Teste prático: troque a palavra feminina por masculina. “Fui à escola” → “Fui ao colégio”. Se aparece “ao”, há forte indicação de crase. Não ocorre antes de verbo, palavra masculina e em expressões como “a pé”.</p>\n<p><strong>Estratégia de prova:</strong> antes de marcar, diga qual regra explica sua escolha. Isso reduz acertos por chute.</p>", "qs": [["Em “A cidade acordou assustada com a tempestade”, ocorre:", ["personificação", "metonímia", "eufemismo", "antítese"], 0, "A cidade recebe uma característica humana: acordar assustada."], ["Assinale o uso correto da crase:", ["Começou à estudar.", "Fui à biblioteca.", "Entreguei à Pedro.", "Voltei à pé."], 1, "Em “fui à biblioteca”, o verbo pede preposição a e “biblioteca” admite artigo a: a + a = à."], ["Em “Li Clarice Lispector durante as férias”, ocorre:", ["hipérbole", "personificação", "metonímia", "antítese"], 2, "O nome da autora é empregado no lugar de sua obra: relação de proximidade, portanto metonímia."]]}, {"day": "Terça-feira", "id": "geo", "title": "Geografia — Relevo e Caatinga", "study": "<h3>Agentes do relevo</h3><p><strong>Internos:</strong> tectonismo, vulcanismo e terremotos; têm origem na dinâmica interna da Terra. <strong>Externos:</strong> intemperismo, erosão, transporte e sedimentação; atuam modelando a superfície.</p>\n<h3>Caatinga</h3><p>O semiárido tem chuvas irregulares e longos períodos secos. Muitas plantas reduzem folhas, possuem espinhos, perdem folhas na seca, armazenam água ou têm raízes adaptadas. São estratégias para <strong>reduzir perda e aproveitar água</strong>.</p>\n<p><strong>Armadilha:</strong> seca não significa ausência de biodiversidade. A Caatinga é um bioma com espécies adaptadas às condições locais.</p>", "qs": [["Qual par apresenta somente agentes externos do relevo?", ["vulcanismo e tectonismo", "intemperismo e erosão", "terremotos e dobramentos", "tectonismo e sedimentação"], 1, "Intemperismo e erosão atuam na superfície e são agentes externos."], ["Espinhos e redução de folhas em muitas plantas da Caatinga ajudam principalmente a:", ["aumentar a transpiração", "reduzir a perda de água", "absorver sal do oceano", "resistir à neve"], 1, "Folhas reduzidas e espinhos diminuem a superfície de transpiração, ajudando a conservar água."], ["Um processo que desgasta e transporta materiais da superfície é:", ["erosão", "tectonismo", "vulcanismo", "dobramento"], 0, "Erosão envolve desgaste e remoção/transporte de materiais por água, vento e outros agentes."]]}, {"day": "Terça-feira", "id": "bio", "title": "Biologia — Oxigênio, hemácias e hemoglobina", "study": "<p>Nos pulmões, o oxigênio passa dos alvéolos para o sangue. A maior parte dele é transportada ligada à <strong>hemoglobina</strong>, proteína presente nas <strong>hemácias</strong> (glóbulos vermelhos).</p>\n<p><strong>Leucócitos</strong> atuam principalmente na defesa. <strong>Plaquetas</strong> participam da coagulação. A associação que precisa ficar automática é: <strong>hemácia + hemoglobina → transporte de O₂</strong>.</p>\n<p><strong>Aplicação:</strong> quando uma questão mistura células sanguíneas, identifique primeiro a função pedida: transporte, defesa ou coagulação.</p>", "qs": [["A maior parte do oxigênio no sangue é transportada:", ["ligada à hemoglobina", "nas plaquetas", "nos leucócitos", "na bile"], 0, "A hemoglobina das hemácias liga-se ao oxigênio e realiza a maior parte do transporte."], ["A principal função das plaquetas está relacionada à:", ["defesa específica", "coagulação", "produção de oxigênio", "digestão"], 1, "Plaquetas participam da formação do tampão e dos processos de coagulação."], ["As células sanguíneas mais associadas à defesa do organismo são:", ["hemácias", "plaquetas", "leucócitos", "adipócitos"], 2, "Leucócitos são células do sistema de defesa; hemácias transportam gases e plaquetas atuam na coagulação."]]}, {"day": "Quarta-feira", "id": "fis", "title": "Física — Força resultante e Segunda Lei de Newton", "study": "<p>Primeiro determine a <strong>força resultante</strong>. Forças no mesmo sentido somam; em sentidos opostos, subtraem. Depois aplique a Segunda Lei de Newton: <strong>F<sub>R</sub> = m·a</strong>.</p>\n<p><strong>Exemplo:</strong> 50 N para a direita e 20 N para a esquerda → F<sub>R</sub>=30 N para a direita. Massa 5 kg → a=30/5=6 m/s² para a direita.</p>\n<p><strong>Checklist:</strong> desenhe sentidos → calcule resultante → confira kg e N → use a=F/m → escreva direção e unidade.</p>", "qs": [["Um corpo de 4 kg recebe 36 N para a direita e 12 N para a esquerda. A aceleração é:", ["3 m/s² para a direita", "6 m/s² para a direita", "9 m/s² para a direita", "12 m/s² para a esquerda"], 1, "Resultante=36−12=24 N. a=24/4=6 m/s² para a direita."], ["Um corpo de 10 kg sofre força resultante de 50 N. Sua aceleração é:", ["2 m/s²", "5 m/s²", "10 m/s²", "500 m/s²"], 1, "Pela Segunda Lei, a=F/m=50/10=5 m/s²."], ["Forças de 18 N e 7 N atuam em sentidos opostos. A resultante tem módulo:", ["11 N", "25 N", "126 N", "2,6 N"], 0, "Em sentidos opostos, subtraímos os módulos: 18−7=11 N."]]}, {"day": "Quarta-feira", "id": "qui", "title": "Química — Ligações químicas", "study": "<p><strong>Iônica:</strong> envolve formação de íons por transferência de elétrons; em exercícios básicos, aparece frequentemente entre <strong>metal + ametal</strong>. Ex.: NaCl.</p>\n<p><strong>Covalente:</strong> compartilhamento de elétrons, comum entre <strong>ametais</strong>. Ex.: O₂, H₂O. <strong>Metálica:</strong> entre átomos metálicos; relaciona-se à condução elétrica, brilho e maleabilidade.</p>\n<p><strong>Atalho com cuidado:</strong> metal + ametal → pense iônica; ametal + ametal → covalente; substância formada apenas por metais → metálica. Depois confirme pela composição.</p>", "qs": [["A ligação predominante no NaCl é:", ["covalente", "iônica", "metálica", "ponte de hidrogênio"], 1, "Sódio é metal e cloro é ametal; no modelo escolar, ocorre transferência de elétrons e formação de íons."], ["Na molécula O₂, a ligação entre os átomos é:", ["iônica", "metálica", "covalente", "nuclear"], 2, "Dois átomos de oxigênio, ambos ametais, compartilham elétrons: ligação covalente."], ["Uma liga formada por cobre e zinco apresenta predominantemente ligação:", ["metálica", "iônica", "covalente", "molecular"], 0, "Cobre e zinco são metais; ligas metálicas mantêm o tipo de ligação característico dos metais."]]}, {"day": "Quarta-feira", "id": "mat", "title": "Matemática — Equação do 2º grau e Teorema de Pitágoras", "study": "<h3>Equação do 2º grau</h3><p>A forma geral é <strong>ax²+bx+c=0</strong>, com a≠0. Antes de usar Bhaskara, veja se a equação incompleta permite um caminho mais rápido.</p>\n<p>Ex.: x²+5x=0 → coloque x em evidência: <strong>x(x+5)=0</strong>. Se um produto é zero, pelo menos um fator é zero: x=0 ou x+5=0 → <strong>x=−5</strong>.</p>\n<p>Quando precisar de Bhaskara: Δ=b²−4ac e x=(-b±√Δ)/(2a). Identifique a, b e c com os sinais antes de substituir.</p>\n<h3>Pitágoras</h3><p>Em triângulo retângulo: <strong>hipotenusa² = cateto² + cateto²</strong>. A hipotenusa fica em frente ao ângulo de 90°. Ex.: catetos 5 e 12 → h²=25+144=169 → h=13.</p>\n<p><strong>Erro comum:</strong> usar Pitágoras em triângulo que não é retângulo ou chamar um cateto de hipotenusa.</p>", "qs": [["As raízes de x²+6x=0 são:", ["0 e 6", "3 e −3", "0 e −6", "6 e −6"], 2, "Fatore: x(x+6)=0. Logo, x=0 ou x=−6."], ["Para x²−5x+6=0, as raízes são:", ["2 e 3", "−2 e −3", "1 e 6", "0 e 5"], 0, "Fatorando: (x−2)(x−3)=0. Portanto x=2 ou x=3."], ["Um triângulo retângulo tem catetos 9 e 12. A hipotenusa mede:", ["15", "18", "21", "10"], 0, "h²=9²+12²=81+144=225. Logo h=15."]]}], key="laila_erros_terca_quarta_v2"; let state=JSON.parse(localStorage.getItem(key)||"{}");
function render(){
 const app=document.getElementById("app");
 ["Terça-feira","Quarta-feira"].forEach((day,di)=>{
  let sec=document.createElement("section");sec.className="card";sec.innerHTML=`<button class="daybtn" aria-expanded="false">${day} — abrir roteiro</button><div class="hidden"></div>`;
  let db=sec.children[0],box=sec.children[1];db.onclick=()=>{let o=!box.classList.toggle("hidden");db.setAttribute("aria-expanded",o);db.textContent=day+(o?" — fechar roteiro":" — abrir roteiro")};
  topics.filter(t=>t.day===day).forEach(t=>{
   let a=document.createElement("article");a.className="topic";a.innerHTML=`<button class="topicbtn" aria-expanded="false">📘 ${t.title}</button><div class="hidden"><div>${t.study}</div><h3>Exercícios do tópico</h3><div class="questions"></div><button class="check">Corrigir e ver meu resultado</button><div class="feedback" aria-live="polite">${state[t.id]?`Último resultado: ${state[t.id].pct}%. Você pode refazer quando quiser.`:"Faça as questões e depois confira."}</div><div class="details"></div></div>`;
   let tb=a.children[0],inside=a.children[1];tb.onclick=()=>{let o=!inside.classList.toggle("hidden");tb.setAttribute("aria-expanded",o)};
   let qs=a.querySelector(".questions");t.qs.forEach((q,qi)=>{let e=document.createElement("div");e.className="q";e.innerHTML=`<p><strong>${qi+1}.</strong> ${q[0]}</p>`+q[1].map((op,oi)=>`<label><input type="radio" name="${t.id}_${qi}" value="${oi}">${"ABCD"[oi]}) ${op}</label>`).join("");qs.appendChild(e)});
   a.querySelector(".check").onclick=()=>correct(t,a);box.appendChild(a);
  });app.appendChild(sec);
 });update();
}
function correct(t,a){
 let hit=0,rows=[];for(let i=0;i<t.qs.length;i++){let q=t.qs[i],r=a.querySelector(`input[name="${t.id}_${i}"]:checked`);if(!r){a.querySelector(".feedback").textContent="Responda todas as questões antes de corrigir.";return}let chosen=+r.value,ok=chosen===q[2];if(ok)hit++;rows.push(`<div class="review"><strong>Questão ${i+1} — ${ok?"✅ Acertou":"🔎 Errou"}</strong><br>Sua resposta: ${"ABCD"[chosen]}) ${q[1][chosen]}<br>Resposta correta: ${"ABCD"[q[2]]}) ${q[1][q[2]]}<br><strong>Comentário:</strong> ${q[3]}</div>`)}
 let pct=Math.round(hit/t.qs.length*100);state[t.id]={pct,hit,total:t.qs.length};localStorage.setItem(key,JSON.stringify(state));
 let msg=pct===100?"🏆 Excelente: domínio total nesta rodada!":pct>=80?"🚀 Muito bom: você passou de 80%. Revise só o detalhe que escapou.":pct>=60?"🎯 Boa evolução. Leia os comentários dos erros e tente novamente.":"📘 Este tópico ainda merece atenção. Releia a miniaula e refaça com calma.";
 a.querySelector(".feedback").innerHTML=`<strong>${hit}/${t.qs.length} — ${pct}%.</strong> ${msg}`;a.querySelector(".details").innerHTML="<h3>Correção comentada</h3>"+rows.join("");update();
}
function update(){let total=topics.length,done=Object.keys(state).length,avg=done?Math.round(Object.values(state).reduce((s,x)=>s+x.pct,0)/done):0;bar.style.width=Math.round(done/total*100)+"%";progress.textContent=`${done} de ${total} tópicos praticados. Média dos tópicos feitos: ${avg}%.`;}
render();
</script></body></html>
