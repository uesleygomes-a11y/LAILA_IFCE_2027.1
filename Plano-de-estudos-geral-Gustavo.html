<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plano IFCE - Gustavo</title>
<style>body{font-family:system-ui,Arial;max-width:980px;margin:auto;padding:14px;background:#f5f7fb;color:#172033;line-height:1.6}.hero,.card,.topic{background:white;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0001}button{width:100%;text-align:left;font:inherit;font-weight:800;padding:15px;border:0;border-radius:13px;background:#4b46c8;color:white;margin:5px 0}.topic button{background:#eef0ff;color:#28236f;border:2px solid #cbcaff}.hidden{display:none}.feedback{font-weight:800;background:#f0f3ff;padding:12px;border-radius:12px}label{display:block;padding:7px}input{width:20px;height:20px;margin-right:8px}.barbox{height:14px;background:#ddd;border-radius:20px;overflow:hidden}#bar{height:100%;background:#4b46c8;width:0}</style></head><body>
<section class="hero"><h1>🎯 Plano de Estudos — Gustavo</h1><p><strong>Quarta a sábado.</strong> Base pedagógica: conteúdos e estilo da prova preparatória Carmen Rios. Abra o dia → abra o tópico → estude a miniaula → faça a prática → veja seu percentual.</p></section>
<section class="card"><h2>Progresso</h2><div class="barbox"><div id="bar"></div></div><p id="prog"></p></section><main id="app"></main>
<script>
const student="Gustavo", days=[{"day": "Quarta-feira", "items": [{"title": "Língua Portuguesa — interpretação e linguagem", "scope": "Interpretação, inferência, finalidade, explícito/implícito, conectivos, figuras e comunicação.", "lesson": "<p><strong>Estratégia:</strong> descubra primeiro o tema e a ideia principal; só depois compare alternativas. Inferir é concluir usando pistas do texto, não inventar opinião.</p><p><strong>Figuras:</strong> personificação atribui ação humana ao não humano; metonímia troca um termo por outro relacionado; hipérbole exagera. Conectivos são pistas: <em>portanto</em> costuma concluir; <em>embora</em> introduz concessão.</p><p><strong>Exemplo:</strong> “A cidade acordou nervosa” → personificação. “Estudou bastante, portanto ficou confiante” → conclusão.</p>"}, {"title": "Língua Portuguesa — gramática aplicada", "scope": "Crase, formação de palavras, classes, concordância, regência, pontuação e coesão.", "lesson": "<p><strong>Crase:</strong> em regra, preposição <em>a</em> + artigo <em>a/as</em>. Teste: troque o feminino por masculino; “fui à escola” → “fui ao colégio”. Não use antes de verbo ou palavra masculina.</p><p>Em <em>desleal</em>, “des-” é prefixo. Em coesão, observe a quem pronomes se referem e qual relação o conectivo cria.</p>"}, {"title": "História — transformações do mundo moderno", "scope": "Iluminismo, Revolução Industrial e crise de 1929.", "lesson": "<p>Iluminismo: razão, crítica ao absolutismo e privilégios. Revolução Industrial: mecanização, fábricas, urbanização e trabalho assalariado. Crise de 1929: quebra econômica, falências e desemprego.</p><p>Na questão, procure <strong>causa, consequência e mudança social</strong>, não apenas datas.</p>"}, {"title": "História — Brasil republicano", "scope": "Era Vargas, CLT, regime militar, redemocratização e Constituição de 1988.", "lesson": "<p>A CLT foi consolidada em 1943, no governo Vargas. A Constituição de 1988 é marco da redemocratização e ampliação de direitos. Não misture Estado Novo, regime militar e Nova República: organize uma linha do tempo.</p>"}, {"title": "Geografia — cartografia e sociedade", "scope": "Escala, migrações e Mercosul.", "lesson": "<p>Escala 1:500.000: 1 cm = 500.000 cm = 5 km. Assim, 6 cm = 30 km. Igualar unidades evita erro.</p><p>Êxodo rural = campo → cidade. Mercosul = integração econômica regional.</p>"}, {"title": "Geografia — relevo e Caatinga", "scope": "Agentes internos/externos e adaptações ao semiárido.", "lesson": "<p>Internos: tectonismo, vulcanismo e abalos. Externos: intemperismo, erosão e sedimentação. Na Caatinga, plantas apresentam adaptações que reduzem perda de água.</p>"}]}, {"day": "Quinta-feira", "items": [{"title": "Matemática — equações e funções", "scope": "1º grau, 2º grau, fatoração, Bhaskara e função afim.", "lesson": "<p><strong>1º grau:</strong> 3x+5=26 → 3x=21 → x=7.</p><p><strong>2º grau:</strong> ax²+bx+c=0; Δ=b²−4ac; x=(-b±√Δ)/(2a). Antes de Bhaskara, procure fatoração: x²+4x=0 → x(x+4)=0 → raízes 0 e −4.</p><p><strong>Função:</strong> em y=2x+3, x=4 dá y=11.</p>"}, {"title": "Matemática — porcentagem, proporção e juros", "scope": "Porcentagem, regra de três e juros simples.", "lesson": "<p>20% de 350 = 0,20×350 = 70. Se 4 cadernos custam 28, cada um custa 7; 7 custam 49.</p><p><strong>Juros simples:</strong> J=C·i·t e M=C+J. R$1.000 a 3% a.m. por 5 meses → J=150 → M=1.150.</p>"}, {"title": "Matemática — geometria e média", "scope": "Pitágoras, áreas, trapézio e média.", "lesson": "<p>Pitágoras: hipotenusa² = cateto² + cateto². Catetos 6 e 8 → 36+64=100 → hipotenusa 10.</p><p>Retângulo=b·h; triângulo=b·h/2; trapézio=(B+b)·h/2. Média=soma/quantidade.</p>"}, {"title": "Biologia — célula e divisão", "scope": "Organelas, ATP, mitose e meiose.", "lesson": "<p>Mitocôndria produz ATP; ribossomo sintetiza proteínas; Golgi modifica/empacota; lisossomo participa da digestão intracelular. Mitose: crescimento/reparo. Meiose: formação de gametas; humanos → 23 cromossomos.</p>"}, {"title": "Biologia — genética e ecologia", "scope": "Genótipo/fenótipo, cadeias e fluxo de energia.", "lesson": "<p>Genótipo é a combinação genética; fenótipo é a característica observável influenciada por genes e ambiente. Em cadeias, produtores captam energia; consumidores alimentam-se; decompositores reciclam matéria.</p>"}]}, {"day": "Sexta-feira", "items": [{"title": "Física — movimento e Newton", "scope": "Velocidade média, força e três leis de Newton.", "lesson": "<p>vm=Δs/Δt. Segunda lei: F=m·a. Na terceira lei, ação e reação têm mesma intensidade e sentidos opostos, mas atuam em <strong>corpos diferentes</strong>.</p><p>Resolva sempre em sequência: dados → unidades → fórmula → cálculo → unidade final.</p>"}, {"title": "Física — energia e potência", "scope": "Trabalho, energia, potência e noções elétricas.", "lesson": "<p>Potência mede rapidez de transformação/transferência de energia: P=E/Δt. Em mecânica, trabalho pode ser W=F·d quando força e deslocamento são paralelos. Identifique a grandeza pedida antes de escolher fórmula.</p>"}, {"title": "Química — misturas e separação", "scope": "Substâncias, misturas, filtração, decantação e destilação.", "lesson": "<p>Água+areia é mistura heterogênea e pode ser filtrada. Decantação usa diferença de densidade; destilação explora volatilidade/ponto de ebulição. Escolha o método pelas propriedades.</p>"}, {"title": "Química — átomo e distribuição", "scope": "Número atômico, prótons, elétrons e camadas.", "lesson": "<p>Z = número de prótons. Átomo neutro: prótons=elétrons. Z=12 → 12 prótons e 12 elétrons. Distribuição 2-8-1 indica um elétron na camada de valência e tendência escolar a perdê-lo.</p>"}, {"title": "Química — ligações e reações", "scope": "Ligação iônica/covalente e balanceamento.", "lesson": "<p>Iônica: transferência de elétrons, comum metal+ametal; NaCl é exemplo. Covalente: compartilhamento. Balanceamento conserva átomos: 2H₂+O₂→2H₂O. Altere coeficientes, não índices.</p>"}]}, {"day": "Sábado", "items": [{"title": "Revisão ativa — leve", "scope": "Recuperar conceitos sem conteúdo novo pesado.", "lesson": "<p>Explique em voz alta um conceito de cada disciplina sem consultar. Depois confira. Revise fórmulas, conectivos, linha do tempo e erros anotados. Travou? Faça revisão curta e siga.</p>"}, {"title": "Desafio relâmpago", "scope": "Questões curtas e variadas.", "lesson": "<p>Objetivo: aquecer o raciocínio e reconhecer armadilhas. Errou → descubra se foi conteúdo, interpretação, cálculo ou distração → siga. Nada de transformar um erro em uma maratona na véspera.</p>"}, {"title": "Estratégia de prova e redação", "scope": "Tempo, cartão-resposta e planejamento da redação.", "lesson": "<p>Leia comando, gênero e restrições da redação antes de escrever. Planeje rapidamente, escreva e reserve minutos para revisar. Na objetiva, faça primeiro o que destrava seu ritmo e marque as demoradas para voltar.</p>"}]}], bank=[["Língua Portuguesa", "Em “A escola respirou aliviada ao fim da prova”, ocorre:", ["personificação", "metonímia", "antítese", "eufemismo"], 0], ["Língua Portuguesa", "Em “Embora estivesse cansado, continuou”, a relação é de:", ["concessão", "conclusão", "causa", "adição"], 0], ["Língua Portuguesa", "Assinale o uso adequado da crase:", ["Cheguei à sala cedo.", "Começou à correr.", "Entreguei à Pedro.", "Foi à pé."], 0], ["Língua Portuguesa", "Informação implícita é aquela que:", ["pode ser inferida por pistas", "sempre aparece no título", "é necessariamente opinião", "não se relaciona ao texto"], 0], ["Língua Portuguesa", "Em “Li Machado de Assis”, ocorre:", ["metonímia", "hipérbole", "antítese", "eufemismo"], 0], ["Língua Portuguesa", "“Portanto” normalmente introduz ideia de:", ["conclusão", "oposição", "condição", "causa"], 0], ["Língua Portuguesa", "A palavra “infeliz” apresenta:", ["prefixo", "sufixo", "composição", "abreviação"], 0], ["Língua Portuguesa", "A língua compartilhada por emissor e receptor é o:", ["código", "canal", "ruído", "referente"], 0], ["Língua Portuguesa", "Texto com instruções passo a passo é predominantemente:", ["injuntivo", "narrativo", "lírico", "dramático"], 0], ["Língua Portuguesa", "Inferir em leitura significa:", ["concluir a partir de pistas", "copiar uma frase", "ignorar contexto", "opinar sem evidência"], 0], ["História", "O Iluminismo valorizava:", ["razão e crítica aos privilégios", "direito divino absoluto", "servidão feudal", "censura científica"], 0], ["História", "A Revolução Industrial intensificou:", ["urbanização e produção fabril", "fim das máquinas", "retorno feudal", "fim do salário"], 0], ["História", "A crise de 1929 associou-se a:", ["falências e desemprego", "fim de toda indústria", "pleno emprego", "fim mundial das bolsas"], 0], ["História", "A CLT foi consolidada no governo de:", ["Getúlio Vargas", "Dom Pedro I", "Deodoro", "José Sarney"], 0], ["História", "A Constituição de 1988 marcou:", ["redemocratização e direitos", "início do Estado Novo", "AI-5", "retorno monárquico"], 0], ["Geografia", "Na escala 1:500.000, 3 cm representam:", ["15 km", "1,5 km", "150 km", "30 km"], 0], ["Geografia", "É agente externo do relevo:", ["erosão", "tectonismo", "vulcanismo", "dobramento"], 0], ["Geografia", "Na Caatinga, adaptações vegetais ajudam a:", ["economizar água", "viver sob neve", "aumentar transpiração", "viver em gelo"], 0], ["Geografia", "Êxodo rural é:", ["campo-cidade", "cidade-campo", "país-país", "bairro-bairro"], 0], ["Geografia", "Mercosul é:", ["bloco econômico", "relevo", "bioma", "organização militar"], 0], ["Biologia", "Produção de ATP ocorre principalmente na:", ["mitocôndria", "lisossomo", "centríolo", "parede celular"], 0], ["Biologia", "Gametas humanos possuem normalmente:", ["23 cromossomos", "46 pares", "92 cromossomos", "46 pares de genes"], 0], ["Biologia", "Mitose relaciona-se a:", ["crescimento e reparo", "redução cromossômica", "gametas apenas", "fotossíntese"], 0], ["Biologia", "Ribossomos participam da:", ["síntese de proteínas", "digestão intracelular", "respiração pulmonar", "erosão"], 0], ["Biologia", "Produtores numa cadeia alimentar:", ["captam energia e produzem matéria orgânica", "comem consumidores", "não usam energia", "são sempre fungos"], 0], ["Física", "Velocidade média é:", ["deslocamento/tempo", "massa×aceleração", "energia×tempo", "força/distância"], 0], ["Física", "F=m·a corresponde à:", ["segunda lei de Newton", "lei de Ohm", "terceira lei", "lei de Coulomb"], 0], ["Física", "Ação e reação:", ["atuam em corpos diferentes", "atuam no mesmo corpo", "têm intensidades diferentes", "só existem em repouso"], 0], ["Física", "Potência mede:", ["rapidez de transformação de energia", "quantidade de matéria", "distância", "temperatura"], 0], ["Física", "Unidade SI de potência:", ["watt", "newton", "metro", "ampere-hora"], 0], ["Química", "Água e areia podem ser separadas por:", ["filtração", "fusão", "sublimação", "eletrólise"], 0], ["Química", "Átomo neutro Z=12 possui:", ["12 prótons e 12 elétrons", "12 prótons e 10 elétrons", "24 elétrons", "10 prótons"], 0], ["Química", "Distribuição 2-8-1 sugere tendência a:", ["perder 1 elétron", "ganhar 7 prótons", "ser gás nobre", "ter 2 elétrons"], 0], ["Química", "Ligação predominante no NaCl:", ["iônica", "covalente apolar", "metálica", "nuclear"], 0], ["Química", "Em 2H₂+O₂→2H₂O, soma dos coeficientes:", ["5", "3", "4", "6"], 0], ["Matemática", "20% de 450 é:", ["90", "80", "70", "100"], 0], ["Matemática", "Raízes de x²+6x=0:", ["0 e -6", "0 e 6", "-3 e 3", "6 e 6"], 0], ["Matemática", "R$800 a 2% a.m. por 5 meses, juros simples, dá montante:", ["R$880", "R$820", "R$900", "R$960"], 0], ["Matemática", "Catetos 5 e 12 formam hipotenusa:", ["13", "15", "17", "10"], 0], ["Matemática", "3 cadernos custam R$24; 7 custam:", ["R$56", "R$48", "R$64", "R$72"], 0], ["Matemática", "Área de retângulo 9×8:", ["72", "34", "64", "81"], 0], ["Matemática", "4x+3=31. x vale:", ["7", "6", "8", "9"], 0], ["Matemática", "Média de 5, 7 e 9:", ["7", "6", "8", "21"], 0], ["Matemática", "y=3x+2; para x=4:", ["14", "12", "16", "10"], 0], ["Matemática", "Trapézio bases 8 e 12, altura 5: área:", ["50", "40", "100", "25"], 0]], key='plano_ifce_cr_'+student.toLowerCase();let state=JSON.parse(localStorage.getItem(key)||'{}');
function poolFor(title){let d=title.startsWith('Língua')?'Língua Portuguesa':title.split(' — ')[0];let p=bank.filter(q=>q[0]===d);if(!p.length)p=bank.slice(0,3);return p.slice(0,3)}
function render(){let app=document.getElementById('app');days.forEach((day,di)=>{let s=document.createElement('section');s.className='card';s.innerHTML=`<button aria-expanded="false">${day.day} — abrir</button><div class="hidden"></div>`;let db=s.children[0],box=s.children[1];db.onclick=()=>{let o=box.classList.toggle('hidden')===false;db.setAttribute('aria-expanded',o);db.textContent=day.day+(o?' — fechar':' — abrir')};day.items.forEach((it,ii)=>{let id=di+'_'+ii,w=document.createElement('article');w.className='topic';w.innerHTML=`<button aria-expanded="false">📘 ${it.title}</button><div class="hidden"><p><strong>O que estudar:</strong> ${it.scope}</p>${it.lesson}<h4>Prática do tópico</h4><div class="practice"></div><p class="feedback" aria-live="polite">${state[id]?('Último resultado: '+state[id]+'%.'): 'Faça as questões e confira.'}</p></div>`;let tb=w.children[0],inside=w.children[1];tb.onclick=()=>{let o=inside.classList.toggle('hidden')===false;tb.setAttribute('aria-expanded',o)};let p=poolFor(it.title),area=w.querySelector('.practice');p.forEach((q,qi)=>{let e=document.createElement('div');e.innerHTML=`<p><strong>${qi+1}.</strong> ${q[1]}</p>`+q[2].map((o,oi)=>`<label><input type="radio" name="x${id}_${qi}" value="${oi}">${'ABCD'[oi]}) ${o}</label>`).join('');area.appendChild(e)});let c=document.createElement('button');c.textContent='Conferir prática';c.onclick=()=>{let hit=0;for(let qi=0;qi<p.length;qi++){let a=w.querySelector(`input[name="x${id}_${qi}"]:checked`);if(!a){w.querySelector('.feedback').textContent='Responda todas antes de conferir.';return}if(+a.value===p[qi][3])hit++}let pct=Math.round(hit/p.length*100);state[id]=pct;localStorage.setItem(key,JSON.stringify(state));let msg=pct>=80?'🏆 Conquista! 80% ou mais.':pct>=60?'🚀 Boa base; corrija o erro e tente explicar a resposta.':'🎯 Releia a miniaula e faça outra rodada.';w.querySelector('.feedback').textContent=`${hit}/${p.length} — ${pct}%. ${msg}`;update()};inside.appendChild(c);box.appendChild(w)});app.appendChild(s)});update()}
function update(){let total=days.reduce((n,d)=>n+d.items.length,0),done=Object.keys(state).length,p=Math.round(done/total*100);bar.style.width=p+'%';prog.textContent=`${done} de ${total} tópicos praticados — ${p}%.`}render();
</script></body></html>
