<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulado IFCE - Laila</title><style>body{font-family:system-ui,Arial;max-width:950px;margin:auto;padding:14px;background:#f5f7fb;color:#172033}.card,.q{background:white;padding:18px;border-radius:18px;margin:14px 0}button{font:inherit;font-weight:800;padding:14px;border:0;border-radius:12px;background:#4b46c8;color:white;margin:5px}label{display:block;padding:8px}input{width:20px;height:20px;margin-right:8px}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.win{font-size:1.15rem;font-weight:900;background:#eaf8ef;padding:14px;border-radius:12px}</style></head><body>
<h1>Simulado IFCE 2027.1 — Laila</h1><section id="home" class="card"><p>45 questões, seguindo disciplinas, conteúdos e estilo-base do Carmen Rios. As alternativas e a ordem são embaralhadas a cada tentativa.</p><div id="hist"></div><button onclick="start()">Começar simulado</button></section><section id="test" class="hidden"><div id="qs"></div><button onclick="finish()">Finalizar</button></section><section id="result" class="hidden card" tabindex="-1"></section>
<script>
const student="Laila",bank=[["Língua Portuguesa", "Em “A escola respirou aliviada ao fim da prova”, ocorre:", ["personificação", "metonímia", "antítese", "eufemismo"], 0], ["Língua Portuguesa", "Em “Embora estivesse cansado, continuou”, a relação é de:", ["concessão", "conclusão", "causa", "adição"], 0], ["Língua Portuguesa", "Assinale o uso adequado da crase:", ["Cheguei à sala cedo.", "Começou à correr.", "Entreguei à Pedro.", "Foi à pé."], 0], ["Língua Portuguesa", "Informação implícita é aquela que:", ["pode ser inferida por pistas", "sempre aparece no título", "é necessariamente opinião", "não se relaciona ao texto"], 0], ["Língua Portuguesa", "Em “Li Machado de Assis”, ocorre:", ["metonímia", "hipérbole", "antítese", "eufemismo"], 0], ["Língua Portuguesa", "“Portanto” normalmente introduz ideia de:", ["conclusão", "oposição", "condição", "causa"], 0], ["Língua Portuguesa", "A palavra “infeliz” apresenta:", ["prefixo", "sufixo", "composição", "abreviação"], 0], ["Língua Portuguesa", "A língua compartilhada por emissor e receptor é o:", ["código", "canal", "ruído", "referente"], 0], ["Língua Portuguesa", "Texto com instruções passo a passo é predominantemente:", ["injuntivo", "narrativo", "lírico", "dramático"], 0], ["Língua Portuguesa", "Inferir em leitura significa:", ["concluir a partir de pistas", "copiar uma frase", "ignorar contexto", "opinar sem evidência"], 0], ["História", "O Iluminismo valorizava:", ["razão e crítica aos privilégios", "direito divino absoluto", "servidão feudal", "censura científica"], 0], ["História", "A Revolução Industrial intensificou:", ["urbanização e produção fabril", "fim das máquinas", "retorno feudal", "fim do salário"], 0], ["História", "A crise de 1929 associou-se a:", ["falências e desemprego", "fim de toda indústria", "pleno emprego", "fim mundial das bolsas"], 0], ["História", "A CLT foi consolidada no governo de:", ["Getúlio Vargas", "Dom Pedro I", "Deodoro", "José Sarney"], 0], ["História", "A Constituição de 1988 marcou:", ["redemocratização e direitos", "início do Estado Novo", "AI-5", "retorno monárquico"], 0], ["Geografia", "Na escala 1:500.000, 3 cm representam:", ["15 km", "1,5 km", "150 km", "30 km"], 0], ["Geografia", "É agente externo do relevo:", ["erosão", "tectonismo", "vulcanismo", "dobramento"], 0], ["Geografia", "Na Caatinga, adaptações vegetais ajudam a:", ["economizar água", "viver sob neve", "aumentar transpiração", "viver em gelo"], 0], ["Geografia", "Êxodo rural é:", ["campo-cidade", "cidade-campo", "país-país", "bairro-bairro"], 0], ["Geografia", "Mercosul é:", ["bloco econômico", "relevo", "bioma", "organização militar"], 0], ["Biologia", "Produção de ATP ocorre principalmente na:", ["mitocôndria", "lisossomo", "centríolo", "parede celular"], 0], ["Biologia", "Gametas humanos possuem normalmente:", ["23 cromossomos", "46 pares", "92 cromossomos", "46 pares de genes"], 0], ["Biologia", "Mitose relaciona-se a:", ["crescimento e reparo", "redução cromossômica", "gametas apenas", "fotossíntese"], 0], ["Biologia", "Ribossomos participam da:", ["síntese de proteínas", "digestão intracelular", "respiração pulmonar", "erosão"], 0], ["Biologia", "Produtores numa cadeia alimentar:", ["captam energia e produzem matéria orgânica", "comem consumidores", "não usam energia", "são sempre fungos"], 0], ["Física", "Velocidade média é:", ["deslocamento/tempo", "massa×aceleração", "energia×tempo", "força/distância"], 0], ["Física", "F=m·a corresponde à:", ["segunda lei de Newton", "lei de Ohm", "terceira lei", "lei de Coulomb"], 0], ["Física", "Ação e reação:", ["atuam em corpos diferentes", "atuam no mesmo corpo", "têm intensidades diferentes", "só existem em repouso"], 0], ["Física", "Potência mede:", ["rapidez de transformação de energia", "quantidade de matéria", "distância", "temperatura"], 0], ["Física", "Unidade SI de potência:", ["watt", "newton", "metro", "ampere-hora"], 0], ["Química", "Água e areia podem ser separadas por:", ["filtração", "fusão", "sublimação", "eletrólise"], 0], ["Química", "Átomo neutro Z=12 possui:", ["12 prótons e 12 elétrons", "12 prótons e 10 elétrons", "24 elétrons", "10 prótons"], 0], ["Química", "Distribuição 2-8-1 sugere tendência a:", ["perder 1 elétron", "ganhar 7 prótons", "ser gás nobre", "ter 2 elétrons"], 0], ["Química", "Ligação predominante no NaCl:", ["iônica", "covalente apolar", "metálica", "nuclear"], 0], ["Química", "Em 2H₂+O₂→2H₂O, soma dos coeficientes:", ["5", "3", "4", "6"], 0], ["Matemática", "20% de 450 é:", ["90", "80", "70", "100"], 0], ["Matemática", "Raízes de x²+6x=0:", ["0 e -6", "0 e 6", "-3 e 3", "6 e 6"], 0], ["Matemática", "R$800 a 2% a.m. por 5 meses, juros simples, dá montante:", ["R$880", "R$820", "R$900", "R$960"], 0], ["Matemática", "Catetos 5 e 12 formam hipotenusa:", ["13", "15", "17", "10"], 0], ["Matemática", "3 cadernos custam R$24; 7 custam:", ["R$56", "R$48", "R$64", "R$72"], 0], ["Matemática", "Área de retângulo 9×8:", ["72", "34", "64", "81"], 0], ["Matemática", "4x+3=31. x vale:", ["7", "6", "8", "9"], 0], ["Matemática", "Média de 5, 7 e 9:", ["7", "6", "8", "21"], 0], ["Matemática", "y=3x+2; para x=4:", ["14", "12", "16", "10"], 0], ["Matemática", "Trapézio bases 8 e 12, altura 5: área:", ["50", "40", "100", "25"], 0]],dist={"Língua Portuguesa": 10, "História": 5, "Geografia": 5, "Biologia": 5, "Física": 5, "Química": 5, "Matemática": 10},key='sim_ifce_cr_'+student.toLowerCase();let current=[];
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){current=[];Object.entries(dist).forEach(([d,n])=>{let p=sh(bank.filter(q=>q[0]===d));for(let i=0;i<n;i++){let q=p[i%p.length],ops=sh(q[2].map((t,j)=>({t,ok:j===q[3]})));current.push({d,t:q[1],ops})}});current=sh(current);home.classList.add('hidden');result.classList.add('hidden');test.classList.remove('hidden');qs.innerHTML='';current.forEach((q,i)=>{let e=document.createElement('div');e.className='q';e.innerHTML=`<p><strong>${i+1}. [${q.d}]</strong> ${q.t}</p>`+q.ops.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}">${'ABCD'[j]}) ${o.t}</label>`).join('');qs.appendChild(e)});scrollTo(0,0)}
function finish(){let missing=current.filter((q,i)=>!document.querySelector(`input[name=q${i}]:checked`)).length;if(missing){alert('Faltam '+missing+' questões.');return}let per={},hits=0;current.forEach((q,i)=>{let j=+document.querySelector(`input[name=q${i}]:checked`).value,ok=q.ops[j].ok;per[q.d]??={h:0,n:0};per[q.d].n++;if(ok){hits++;per[q.d].h++}});let pct=Math.round(hits/45*1000)/10,h=JSON.parse(localStorage.getItem(key)||'[]'),prev=h.at(-1),rec={date:new Date().toLocaleString('pt-BR'),hits,pct,per};h.push(rec);localStorage.setItem(key,JSON.stringify(h));test.classList.add('hidden');result.classList.remove('hidden');let msg=pct>=90?'🏆 Excelente!':pct>=80?'🚀 Conquista: 80% ou mais!':pct>=60?'🎯 Boa base; agora ataque os pontos abaixo.':'📘 Use o diagnóstico como mapa de revisão.';let rows=Object.entries(per).map(([d,v])=>{let p=Math.round(v.h/v.n*100),c='—';if(prev?.per?.[d]){let old=Math.round(prev.per[d].h/prev.per[d].n*100),df=p-old;c=`${old}% → ${p}% (${df>=0?'+':''}${df} p.p.)`}return `<tr><td>${d}</td><td>${v.h}/${v.n} (${p}%)</td><td>${c}</td></tr>`}).join('');result.innerHTML=`<h2>Resultado</h2><p class="win">${hits}/45 — ${pct}%. ${msg}</p>${prev?`<p>Geral: ${prev.pct}% → ${pct}%.</p>`:'<p>Primeira tentativa: será a base da próxima comparação.</p>'}<table><tr><th>Disciplina</th><th>Atual</th><th>Versus anterior</th></tr>${rows}</table><button onclick="location.reload()">Histórico</button><button onclick="start()">Outro simulado</button>`;result.focus()}
function showHist(){let h=JSON.parse(localStorage.getItem(key)||'[]');hist.innerHTML=h.length?'<h2>Histórico</h2>'+h.map((r,i)=>`<p><strong>${i+1}ª:</strong> ${r.hits}/45 — ${r.pct}% — ${r.date}</p>`).join(''):'<p>Ainda não há tentativa digital.</p>'}showHist();
</script></body></html>
